[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actukit"
version = "0.1.0"
description = "Mini actuarial data-science toolkit: fast C/C++ core, SQL, Python"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ricsmwangi", email = "ericmwangi530@gmail.com" }]
license = { text = "MIT" }
dependencies = ["pandas>=3.0", "matplotlib>=3.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "pre-commit>=3.7", "ruff>=0.5", "black>=24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.black]
line-length    = 100
target-version = ["py310"]
